<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>KEJAR DEADLINE</title>
    <style>
        /* CSS - STYLESHEET LENGKAP */
        :root {
            --bg: #0f172a;
            --primary: #6366f1;
            --accent: #facc15;
            --danger: #ef4444;
            --success: #22c55e;
            --glass: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.15);
            --text: #f1f5f9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            user-select: none;
        }
        #app {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 100dvh;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.7);
        }
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
            transition: opacity 0.3s;
        }
        .hidden { opacity: 0; pointer-events: none; z-index: -1; }
        .btn {
            background: linear-gradient(135deg, var(--primary), #4338ca);
            color: white;
            border: none;
            padding: 16px 48px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(99,102,241,0.4);
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:active { transform: scale(0.95); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); box-shadow: none; }
        input[type="text"] {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 16px;
            color: white;
            font-size: 1.1rem;
            width: 80%;
            text-align: center;
            outline: none;
            margin-top: 20px;
        }
        input:focus { border-color: var(--accent); }
        h1 { font-size: clamp(2.5rem, 12vw, 4rem); color: var(--accent); text-align: center; line-height: 1.1; text-shadow: 0 0 30px rgba(250,204,21,0.3); }
        p { color: #94a3b8; margin: 10px 0 30px; text-align: center; }
        
        /* HUD */
        #screen-game { justify-content: flex-start; }
        #hud {
            position: absolute; top: 0; width: 100%; padding: 15px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            background: linear-gradient(180deg, rgba(15,23,42,0.9) 0%, transparent 100%);
            z-index: 5;
        }
        .stat-box {
            background: var(--glass); padding: 10px; border-radius: 12px;
            display: flex; flex-direction: column; gap: 5px;
            border: 1px solid var(--border);
        }
        .stat-label { font-size: 0.8rem; display: flex; justify-content: space-between; }
        .progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.3s; }
        #bar-focus { background: var(--primary); width: 100%; }
        #bar-task { background: var(--success); width: 0%; }
        #timer { grid-column: span 2; text-align: center; font-size: 2.5rem; font-weight: 800; color: var(--accent); text-shadow: 0 0 20px rgba(250,204,21,0.4); background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; }
        
        /* PLAY AREA */
        #play-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #player {
            position: absolute; bottom: 90px;
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #fff, #cbd5e1);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.8rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 3px solid #0f172a;
            left: 50%; transform: translateX(-50%);
            z-index: 10;
        }
        .item {
            position: absolute;
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.4rem;
            will-change: transform;
        }
        .prod { background: rgba(34,197,94,0.3); border: 2px solid var(--success); box-shadow: 0 0 15px var(--success); }
        .dist { background: rgba(239,68,68,0.3); border: 2px solid var(--danger); box-shadow: 0 0 15px var(--danger); }
        .spec { background: rgba(250,204,21,0.3); border: 2px solid var(--accent); box-shadow: 0 0 20px var(--accent); }
        
        .float-text {
            position: absolute;
            font-weight: bold; font-size: 1.2rem;
            pointer-events: none;
            animation: floatUp 1s forwards;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); z-index: 20;
        }
        @keyframes floatUp { to { transform: translateY(-60px); opacity: 0; } }
        
        #toast-container {
            position: absolute; top: 20%; width: 100%;
            display: flex; flex-direction: column; align-items: center;
            pointer-events: none; z-index: 15;
        }
        .toast {
            background: rgba(15,23,42,0.95);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 50px;
            margin-bottom: 10px;
            backdrop-filter: blur(10px);
            animation: toastIn 2s forwards;
        }
        @keyframes toastIn { 0% { transform: translateY(-20px); opacity: 0; } 10% { transform: translateY(0); opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }
        
        /* CUTSCENE */
        .dialog {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            padding: 25px; border-radius: 20px;
            border-left: 4px solid var(--accent);
            margin-bottom: 30px;
            animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1);
        }
        .time { font-size: 0.8rem; color: var(--accent); margin-bottom: 8px; letter-spacing: 2px; }
        .msg { font-size: 1.1rem; line-height: 1.5; }
        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* END */
        .result-title { font-size: 2.2rem; margin-bottom: 10px; }
        .win { color: var(--success); }
        .lose { color: var(--danger); }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 350px; background: var(--glass); padding: 20px; border-radius: 16px; }
        .stat-row { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 6px; font-size: 0.9rem; }
        .gap { display: flex; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

<div id="app">
    <!-- MENU -->
    <div id="screen-menu" class="screen">
        <h1>KEJAR<br>DEADLINE</h1>
        <p>Bantu menyelesaikan tugas sebelum waktu habis!</p>
        
        <div style="display:flex; gap:15px; margin-bottom:30px;">
            <div style="background:var(--glass); padding:12px 20px; border-radius:50px; border:1px solid var(--border);">
                <span style="font-size:0.8rem; color:#94a3b8;">High Score</span><br>
                <span id="ui-hs" style="font-weight:bold;">0</span>
            </div>
            <div style="background:var(--glass); padding:12px 20px; border-radius:50px; border:1px solid var(--border);">
                <span style="font-size:0.8rem; color:#94a3b8;">Tugas Selesai</span><br>
                <span id="ui-completed" style="font-weight:bold;">0</span>
            </div>
        </div>

        <input type="text" id="input-name" placeholder="Nama Kamu" maxlength="12">
        <button class="btn" id="btn-mulai">MULAI</button>
    </div>

    <!-- CUTSCENE -->
    <div id="screen-cs" class="screen hidden">
        <div class="dialog">
            <div class="time">MINGGU, 23.47</div>
            <div class="msg" id="cs-msg">
                Halo <b id="cs-nama"></b>, tugas harus dikumpulkan besok pagi.<br><br>Waktu tidak banyak. Tetap fokus!
            </div>
        </div>
        <button class="btn" id="btn-play">▶️ Mulai Belajar</button>
    </div>

    <!-- GAME -->
    <div id="screen-game" class="screen hidden">
        <!-- HUD -->
        <div id="hud" style="padding-top:env(safe-area-inset-top);">
            <div class="stat-box">
                <div class="stat-label"><span>🏆 Skor</span><span id="ui-skor">0</span></div>
                <div class="progress-bar"><div id="bar-focus" class="progress-fill"></div></div>
            </div>
            <div class="stat-box">
                <div class="stat-label"><span>📄 Tugas</span><span id="ui-persen">0%</span></div>
                <div class="progress-bar"><div id="bar-task" class="progress-fill"></div></div>
            </div>
            <div id="timer">01:30</div>
        </div>

        <div id="play-area">
            <div id="player">👩‍🎓</div>
        </div>

        <div id="toast-container"></div>
    </div>

    <!-- END -->
    <div id="screen-end" class="screen hidden">
        <div class="result-title" id="result-title"></div>
        <div style="color:#94a3b8; margin-bottom:20px;" id="result-title2"></div>

        <div class="stats" id="stats-list"></div>

        <div class="gap">
            <button class="btn" id="btn-retry">🔄 Main Lagi</button>
            <button class="btn btn-outline" id="btn-menu">🏠 Menu</button>
        </div>
    </div>
</div>

<script>
/**
 * KEJAR DEADLINE - Full Game Logic
 */

// --- KONFIGURASI ---
const KONFIG = {
    durasi: 90, // detik
    batasFocus: 100,
    batasTask: 100,
    playerSpeed: 1,
    spawnRateAwal: 1200, // ms
};

// --- DATABASE ITEM ---
const ITEM_DB = [
    {t:'prod', i:'📚', s:10, k:5}, {t:'prod', i:'💻', s:15, k:8},
    {t:'prod', i:'📝', s:10, k:6}, {t:'prod', i:'☕', s:10, k:4},
    {t:'dist', i:'📱', s:-10}, {t:'dist', i:'🛏️', s:-15},
    {t:'dist', i:'🎮', s:-20}, {t:'dist', i:'😴', s:-10},
    {t:'spec', i:'☕', s:30, k:0}, // +Focus
    {t:'spec', i:'🚀', s:0, k:20}, // +Task
];

// --- VARIABEL STATE ---
let state = {
    nama: '',
    skor: 0,
    focus: 100,
    task: 0,
    waktu: KONFIG.durasi,
    aktif: false,
    lastSpawn: 0,
    items: [],
    playerX: 50,
    gameLoop: null,
    startTime: 0,
    prodDicapai: 0,
    distDicapai: 0,
    totalMain: 0,
};

// --- DOM ELEMENTS ---
const el = {
    app: document.getElementById('app'),
    menu: document.getElementById('screen-menu'),
    cs: document.getElementById('screen-cs'),
    game: document.getElementById('screen-game'),
    end: document.getElementById('screen-end'),
    inputName: document.getElementById('input-name'),
    btnMulai: document.getElementById('btn-mulai'),
    btnPlay: document.getElementById('btn-play'),
    btnRetry: document.getElementById('btn-retry'),
    btnMenu: document.getElementById('btn-menu'),
    player: document.getElementById('player'),
    playArea: document.getElementById('play-area'),
    timer: document.getElementById('timer'),
    uiSkor: document.getElementById('ui-skor'),
    uiFocus: document.getElementById('bar-focus'),
    uiTask: document.getElementById('bar-task'),
    uiPersen: document.getElementById('ui-persen'),
    uiHs: document.getElementById('ui-hs'),
    uiCompleted: document.getElementById('ui-completed'),
    toast: document.getElementById('toast-container'),
};

// --- INIT ---
function init() {
    loadData();
    el.uiHs.innerText = state.totalMain > 0 ? localStorage.getItem('kd_highscore') || 0 : 0;
    el.uiCompleted.innerText = localStorage.getItem('kd_completed') || 0;
    
    el.btnMulai.addEventListener('click', () => {
        let nama = el.inputName.value.trim();
        if(nama === '') {
            showToast('Masukkan nama dulu!');
            return;
        }
        state.nama = nama;
        showCutscene();
    });

    el.btnPlay.addEventListener('click', startGame);

    el.btnRetry.addEventListener('click', () => {
        resetGame();
        showGame();
        init();
