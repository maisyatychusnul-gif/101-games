<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kejar Deadline</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#1e3a8a,#7c3aed);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
    background: rgba(255,255,255,0.08);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    box-shadow: 0 0 40px rgba(0,0,0,0.3);
    width: 320px;
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

p {
    opacity: 0.8;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    border-radius: 10px;
    border: none;
    outline: none;
    text-align: center;
}

button {
    margin-top: 20px;
    padding: 12px 30px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(135deg,#22c55e,#16a34a);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container" id="menu">
    <h1>⏰ Kejar Deadline</h1>
    <p>Selesaikan tugas sebelum waktu habis!</p>
    <input type="text" id="nama" placeholder="Masukkan nama">
    <button id="startBtn">MULAI</button>
</div>

<div class="container hidden" id="game">
    <h1 id="welcome"></h1>
    <p id="timer">Waktu: 10</p>
    <button id="endBtn">Selesai</button>
</div>

<script>
function init(){
    const startBtn = document.getElementById("startBtn");
    const endBtn = document.getElementById("endBtn");

    const menu = document.getElementById("menu");
    const game = document.getElementById("game");

    const namaInput = document.getElementById("nama");
    const welcome = document.getElementById("welcome");
    const timerText = document.getElementById("timer");

    let waktu = 10;
    let interval;

    startBtn.addEventListener("click", () => {
        const nama = namaInput.value.trim();

        if(nama === ""){
            alert("Isi nama dulu!");
            return;
        }

        menu.classList.add("hidden");
        game.classList.remove("hidden");

        welcome.innerText = "Semangat, " + nama + " 💪";

        waktu = 10;
        timerText.innerText = "Waktu: " + waktu;

        interval = setInterval(() => {
            waktu--;
            timerText.innerText = "Waktu: " + waktu;

            if(waktu <= 0){
                clearInterval(interval);
                alert("Waktu habis!");
                location.reload();
            }
        },1000);
    });

    endBtn.addEventListener("click", () => {
        clearInterval(interval);
        alert("Tugas selesai! 🎉");
        location.reload();
    });
}

document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
