<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catch The Cat PRO 🐱</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:sans-serif;
    background:linear-gradient(135deg,#ffecd2,#fcb69f);
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    padding:12px;
    background:linear-gradient(135deg,#ff7e5f,#feb47b);
    color:white;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

/* GAME AREA */
#game{
    flex:1;
    position:relative;
    overflow:hidden;
}

/* CAT */
#cat{
    position:absolute;
    font-size:55px;
    cursor:pointer;
    transition:all .2s ease;
}

#cat:active{
    transform:scale(.9);
}

/* POP TEXT */
.pop{
    position:absolute;
    font-weight:bold;
    color:#ff4d4d;
    animation:pop .6s forwards;
}

@keyframes pop{
    to{opacity:0;transform:translateY(-40px);}
}

/* BUBBLE */
#bubble{
    position:absolute;
    background:white;
    padding:6px 10px;
    border-radius:10px;
    font-size:12px;
    opacity:0;
    transition:.3s;
}

/* SCREEN */
.screen{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.6);
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

button{
    padding:10px 20px;
    border:none;
    background:#ff7e5f;
    color:white;
    border-radius:8px;
    margin-top:10px;
}

/* MOBILE */
@media(max-width:600px){
    #cat{font-size:45px;}
}
</style>
</head>

<body>

<header>
<div>⏱ <span id="time">30</span></div>
<div>🐱 Catch The Cat</div>
<div>⭐ <span id="score">0</span></div>
</header>

<div id="game">
<div id="cat">🐱</div>
<div id="bubble">meong!</div>

<div id="start" class="screen">
<div class="box">
<h2>Tangkap Kucing!</h2>
<button onclick="startGame()">Mulai</button>
</div>
</div>

<div id="over" class="screen" style="display:none;">
<div class="box">
<h2>Game Over</h2>
<p>Score: <span id="final"></span></p>
<button onclick="startGame()">Main Lagi</button>
</div>
</div>

</div>

<script>
const cat = document.getElementById("cat");
const game = document.getElementById("game");
const bubble = document.getElementById("bubble");

let score=0;
let time=30;
let playing=false;
let timer;

/* SOUND */
function meow(){
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.frequency.setValueAtTime(600,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200,ctx.currentTime+.2);

    gain.gain.setValueAtTime(.2,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.01,ctx.currentTime+.2);

    osc.start();
    osc.stop(ctx.currentTime+.2);
}

/* MOVE CAT */
function moveCat(){
    const w = game.clientWidth - 70;
    const h = game.clientHeight - 70;

    const x = Math.random()*w;
    const y = Math.random()*h;

    cat.style.left=x+"px";
    cat.style.top=y+"px";

    // bubble
    if(Math.random()>0.6){
        bubble.style.left=x+"px";
        bubble.style.top=(y-30)+"px";
        bubble.style.opacity=1;
        bubble.innerText=["meong!","jangan!","aku lari!","😹"][Math.floor(Math.random()*4)];

        setTimeout(()=>bubble.style.opacity=0,1000);
    }
}

/* CLICK */
function hit(e){
    if(!playing) return;

    score++;
    document.getElementById("score").textContent=score;

    meow();

    const pop=document.createElement("div");
    pop.className="pop";
    pop.innerText="+1";
    pop.style.left=cat.offsetLeft+"px";
    pop.style.top=cat.offsetTop+"px";

    game.appendChild(pop);
    setTimeout(()=>pop.remove(),600);

    moveCat();
}

cat.addEventListener("click",hit);
cat.addEventListener("touchstart",hit);

/* START */
function startGame(){
    score=0;
    time=30;

    document.getElementById("score").textContent=0;
    document.getElementById("time").textContent=30;

    document.getElementById("start").style.display="none";
    document.getElementById("over").style.display="none";

    playing=true;
    moveCat();

    clearInterval(timer);
    timer=setInterval(()=>{
        time--;
        document.getElementById("time").textContent=time;

        if(time<=0) endGame();
    },1000);
}

/* END */
function endGame(){
    playing=false;
    clearInterval(timer);

    document.getElementById("final").textContent=score;
    document.getElementById("over").style.display="flex";
}
</script>

</body>
</html>
