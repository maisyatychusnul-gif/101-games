<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .score-board {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            font-size: 1.2em;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #gameCanvas {
            border: 4px solid white;
            background-color: #1a1a2e;
            display: block;
            margin: 0 auto 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            cursor: none;
        }

        .controls {
            color: white;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .game-over {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            z-index: 1000;
            border: 3px solid #f44336;
            box-shadow: 0 0 40px rgba(244, 67, 54, 0.6);
        }

        .game-over h2 {
            color: #f44336;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .game-over p {
            color: white;
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        .game-over .final-score {
            color: #4CAF50;
            font-size: 1.8em;
            margin: 20px 0;
            font-weight: bold;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .stats {
            color: white;
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #4CAF50;
        }
.mobile-controls {
    display: none;
    text-align: center;
    margin-top: 20px;
}

.mobile-controls button {
    width: 60px;
    height: 60px;
    font-size: 24px;
    margin: 5px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
}

@media (max-width: 768px) {
    .mobile-controls {
        display: block;
    }
}
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            #game {
                width: 100%;
                max-width: 90vw;
                height: auto;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 Snake Game</h1>
        
        <div class="game-info">
            <div class="score-board">Score: <span id="score">0</span></div>
            <div class="score-board">High Score: <span id="highScore">0</span></div>
            <div class="score-board">Length: <span id="length">1</span></div>
        </div>

<canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <p>Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to move the snake</p>
            <p>Press <strong>SPACE</strong> to pause/resume</p>
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="togglePause()">Pause</button>
            <button class="btn-danger" onclick="resetGame()">Reset Game</button>
        </div>
        <div class="mobile-controls">
    <button onclick="changeDirection('up')">⬆️</button>

    <div>
        <button onclick="changeDirection('left')">⬅️</button>
        <button onclick="changeDirection('down')">⬇️</button>
        <button onclick="changeDirection('right')">➡️</button>
    </div>
</div>
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Status</div>
                <div class="stat-value" id="status">Playing</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Food Eaten</div>
                <div class="stat-value" id="foodEaten">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Game Time</div>
                <div class="stat-value" id="gameTime">0s</div>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="game-over" id="gameOverScreen">
        <h2>GAME OVER!</h2>
        <p>You hit a wall or ate yourself!</p>
        <div class="final-score">Score: <span id="finalScore">0</span></div>
        <button class="btn-primary" onclick="resetGame()" style="margin-top: 20px;">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game variables
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let foodEaten = 0;
        let gameRunning = true;
        let gamePaused = false;
        let gameStartTime = Date.now();

        // Initialize high score display
        document.getElementById('highScore').textContent = highScore;

        // Game loop
        let lastRenderTime = 0;
        const gameSpeed = 5; // Higher = faster

        function update(currentTime) {
            if (!gameRunning) return;

            if ((currentTime - lastRenderTime) / 1000 < 1 / gameSpeed) {
                requestAnimationFrame(update);
                return;
            }

            lastRenderTime = currentTime;

            if (!gamePaused) {
                // Update direction
                dx = nextDx;
                dy = nextDy;

                // Calculate new head position
                const head = snake[0];
                const newHead = {
                    x: head.x + dx,
                    y: head.y + dy
                };

                // Check wall collision
                if (newHead.x < 0 || newHead.x >= tileCount || newHead.y < 0 || newHead.y >= tileCount) {
                    endGame();
                    requestAnimationFrame(update);
                    return;
                }

                // Check self collision
                for (let i = 0; i < snake.length; i++) {
                    if (newHead.x === snake[i].x && newHead.y === snake[i].y) {
                        endGame();
                        requestAnimationFrame(update);
                        return;
                    }
                }

                // Add new head
                snake.unshift(newHead);

                // Check food collision
                if (newHead.x === food.x && newHead.y === food.y) {
                    score += 10;
                    foodEaten++;
                    generateFood();
                    document.getElementById('score').textContent = score;
                    document.getElementById('foodEaten').textContent = foodEaten;
                } else {
                    // Remove tail if no food eaten
                    snake.pop();
                }

                // Update length
                document.getElementById('length').textContent = snake.length;
                updateGameTime();
            }

            draw();
            requestAnimationFrame(update);
        }

        function generateFood() {
            let newFood;
            let foodOnSnake = true;

            while (foodOnSnake) {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

                foodOnSnake = snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
            }

            food = newFood;
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid (optional)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                // Vertical lines
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();

                // Horizontal lines
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Head - gradient
                    const gradient = ctx.createLinearGradient(
                        segment.x * gridSize, segment.y * gridSize,
                        segment.x * gridSize + gridSize, segment.y * gridSize + gridSize
                    );
                    gradient.addColorStop(0, '#4CAF50');
                    gradient.addColorStop(1, '#45a049');
                    ctx.fillStyle = gradient;
                } else {
                    // Body - different shade
                    ctx.fillStyle = index % 2 === 0 ? '#66BB6A' : '#4CAF50';
                }

                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );

                // Draw eyes on head
                if (index === 0) {
                    ctx.fillStyle = 'white';
                    const eyeSize = 3;
                    const eyeOffset = 5;

                    if (dx === 1) { // Moving right
                        ctx.fillRect(segment.x * gridSize + eyeOffset + 2, segment.y * gridSize + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + eyeOffset + 2, segment.y * gridSize + eyeOffset + 10, eyeSize, eyeSize);
                    } else if (dx === -1) { // Moving left
                        ctx.fillRect(segment.x * gridSize + eyeOffset - 2, segment.y * gridSize + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + eyeOffset - 2, segment.y * gridSize + eyeOffset + 10, eyeSize, eyeSize);
                    } else if (dy === -1) { // Moving up
                        ctx.fillRect(segment.x * gridSize + eyeOffset, segment.y * gridSize + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + eyeOffset + 10, segment.y * gridSize + eyeOffset, eyeSize, eyeSize);
                    } else if (dy === 1) { // Moving down
                        ctx.fillRect(segment.x * gridSize + eyeOffset, segment.y * gridSize + eyeOffset + 2, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + eyeOffset + 10, segment.y * gridSize + eyeOffset + 2, eyeSize, eyeSize);
                    }
                }
            });

            // Draw food (apple)
            ctx.fillStyle = '#FF6B6B';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();

            // Draw shine on food
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2 - 3,
                food.y * gridSize + gridSize / 2 - 3,
                gridSize / 4,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        function updateGameTime() {
            const elapsedSeconds = Math.floor((Date.now() - gameStartTime) / 1000);
            document.getElementById('gameTime').textContent = elapsedSeconds + 's';
        }

        function endGame() {
            gameRunning = false;
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('gameOverScreen').style.display = 'block';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('status').textContent = 'Game Over';

            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }
        }

        function resetGame() {
            snake = [{x: 10, y: 10}];
            food = {x: 15, y: 15};
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            foodEaten = 0;
            gameRunning = true;
            gamePaused = false;
            gameStartTime = Date.now();
            lastRenderTime = 0;

            document.getElementById('score').textContent = '0';
            document.getElementById('length').textContent = '1';
            document.getElementById('foodEaten').textContent = '0';
            document.getElementById('gameTime').textContent = '0s';
            document.getElementById('status').textContent = 'Playing';
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';

            draw();
            requestAnimationFrame(update);
        }

        function togglePause() {
            if (!gameRunning) return;

            gamePaused = !gamePaused;
            document.getElementById('status').textContent = gamePaused ? 'Paused' : 'Playing';
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (dy === 0) { nextDx = 0; nextDy = -1; }
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (dy === 0) { nextDx = 0; nextDy = 1; }
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (dx === 0) { nextDx = -1; nextDy = 0; }
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (dx === 0) { nextDx = 1; nextDy = 0; }
                    e.preventDefault();
                    break;
                case ' ':
                    togglePause();
                    e.preventDefault();
                    break;
            }
        });
function changeDirection(dir) {
    switch(dir) {
        case 'up':
            if (dy === 0) {
                nextDx = 0;
                nextDy = -1;
            }
            break;

        case 'down':
            if (dy === 0) {
                nextDx = 0;
                nextDy = 1;
            }
            break;

        case 'left':
            if (dx === 0) {
                nextDx = -1;
                nextDy = 0;
            }
            break;

        case 'right':
            if (dx === 0) {
                nextDx = 1;
                nextDy = 0;
            }
            break;
    }
}
        // Start the game
        draw();
        requestAnimationFrame(update);
    </script>
</body>
</html>
